name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so newly published security advisories show up as a failed
  # build (and a GitHub email) even when no code changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Only what ships to the browser; dev tooling advisories are not blocking.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      database:
        image: mariadb:11.4.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: lastsave
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/lastsave?serverVersion=11.4.11-MariaDB&charset=utf8mb4

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit

      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console lint:container

      # Migrations must apply cleanly and match the entity mapping.
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console doctrine:schema:validate
